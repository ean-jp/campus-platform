<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Enter code · Campus Platform</title>
    <link rel="icon" href="assets/images/ashesi-logo.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body data-page="verify">

  <header class="site-header">
    <div class="bar">
      <a class="logo" href="index.html"><img src="assets/images/ashesi-logo.png" alt="">Campus Platform</a>
      <div class="nav-spacer"></div>
      <a class="btn ghost sm auto" href="login-email.html">Log in</a>
    </div>
  </header>

  <main class="auth-wrap">
    <section class="card-box auth-card" aria-labelledby="title">
      <p style="margin:0 0 var(--sp-3)"><a class="small muted" href="signup.html">&larr; Back</a></p>
      <h1 id="title">Check your email</h1>
      <p class="muted">We sent a 6-digit code to <strong id="sent-to"></strong>. It expires in 10 minutes.</p>

      <form id="verify-form" novalidate>
        <input type="hidden" name="csrf_token" value="">

        <div class="field">
          <label for="code">Verification code</label>
          <input class="input code-input" id="code" name="code" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="6" placeholder="••••••" required>
          <span class="error" aria-live="polite"></span>
        </div>

        <button class="btn primary" type="submit">Verify email</button>
      </form>

      <div class="or">or</div>
      <button class="btn ghost" type="button" id="resend">Send a new code</button>

      <p class="auth-foot small muted">Wrong email? <a href="signup.html">Start again</a></p>
    </section>
  </main>

  <script src="assets/js/ui.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
