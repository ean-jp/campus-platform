<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Products · Campus Platform</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Poppins:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/vendor.css">
</head>
<body class="v-vendor">

  <header class="v-top">
    <div class="v-top-bar">
      <a class="v-brand" href="index.html">
        <span class="v-brand-tile"><i class="v-ic v-ic-store" aria-hidden="true"></i></span>
        <span>Campus <b>Platform</b></span>
      </a>
      <nav class="v-top-nav" aria-label="Vendor menu">
        <a href="index.html"><i class="v-ic v-ic-home" aria-hidden="true"></i>Dashboard</a>
        <a href="orders.html"><i class="v-ic v-ic-receipt" aria-hidden="true"></i>Orders <span class="v-count">4</span></a>
        <a href="products.html" aria-current="page"><i class="v-ic v-ic-package" aria-hidden="true"></i>Products</a>
        <a href="sales.html"><i class="v-ic v-ic-chart" aria-hidden="true"></i>Sales</a>
        <a href="profile.html"><i class="v-ic v-ic-store" aria-hidden="true"></i>Shop</a>
      </nav>
      <div class="v-top-actions">
        <a class="v-btn v-btn-outline" href="product-form.html" aria-label="Add product"><i class="v-ic v-ic-plus" aria-hidden="true"></i><span class="v-btn-label">Add product</span></a>
        <a class="v-iconbtn" href="notifications.html" aria-label="Notifications, 3 unread"><i class="v-ic v-ic-bell" aria-hidden="true"></i><span class="v-dot-count">3</span></a>
        <span class="v-avatar" title="Ama K.">AK</span>
      </div>
    </div>
  </header>

  <main class="page v-page">
    <div class="v-pagehead">
      <div>
        <span class="v-eyebrow">My shop</span>
        <h1>My products</h1>
        <p id="product-summary">Loading your products…</p>
      </div>
      <a class="v-btn v-btn-red" href="product-form.html"><i class="v-ic v-ic-plus" aria-hidden="true"></i>Add product</a>
    </div>

    <!-- Search + filters: vendor/products.js reloads the grid from GET /api/v1/vendor/items -->
    <form id="product-filters" action="products.html" method="get" role="search">
      <div class="v-search">
        <i class="v-ic v-ic-search" aria-hidden="true"></i>
        <label for="q" class="sr-only">Search your products</label>
        <input type="search" id="q" name="q" placeholder="Search your products..." autocomplete="off">
        <button class="v-btn v-btn-red" type="submit"><i class="v-ic v-ic-search" aria-hidden="true"></i><span class="v-btn-label">Search</span></button>
      </div>
      <div class="v-filters">
        <nav class="v-tabs" aria-label="Filter by status">
          <a class="v-tab" href="products.html" data-status="" aria-current="true">All</a>
          <a class="v-tab" href="products.html?status=active" data-status="active">On sale</a>
          <a class="v-tab" href="products.html?status=sold_out" data-status="sold_out">Sold out</a>
          <a class="v-tab" href="products.html?status=hidden" data-status="hidden">Hidden</a>
        </nav>
        <label for="filter-category" class="sr-only">Category</label>
        <select class="select" id="filter-category" name="category_id">
          <option value="">All categories</option>
        </select>
      </div>
    </form>

    <!-- Cards are built by vendor/products.js (V.productCard) -->
    <div class="v-pgrid" id="product-grid" aria-live="polite"></div>
  </main>

  <nav class="bottom-nav" aria-label="Vendor menu">
    <div class="items">
      <a href="index.html"><i class="v-ic v-ic-home" aria-hidden="true"></i>Home</a>
      <a href="orders.html"><i class="v-ic v-ic-receipt" aria-hidden="true"></i>Orders</a>
      <a href="products.html" aria-current="page"><i class="v-ic v-ic-package" aria-hidden="true"></i>Products</a>
      <a href="sales.html"><i class="v-ic v-ic-chart" aria-hidden="true"></i>Sales</a>
      <a href="profile.html"><i class="v-ic v-ic-store" aria-hidden="true"></i>Shop</a>
    </div>
  </nav>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/vendor/common.js"></script>
  <script src="../assets/js/vendor/products.js"></script>
</body>
</html>
