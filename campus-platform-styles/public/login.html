<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ashesi Campus Platform – Sign in</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/login.css">
</head>
<body class="login-page">
<main class="login-card">
  <section class="login-stage" aria-label="Ashesi Campus Platform">
    <div class="login-ring"></div>
    <h2>Campus Platform</h2>
    <p class="login-tag">Shop, book and connect on campus, all in one place.</p>
    <i class="login-bar"></i>
    <img class="login-hand" alt="" src="assets/img/login-phone.png">
  </section>
  <section class="login-form">
    <div class="login-top">
      <div class="logo"><img alt="" src="assets/img/ashesi-logo.png">Ashesi</div>
      <a href="#signup">Sign up</a>
    </div>
    <div class="login-main">
      <h1>Sign in</h1>
      <p class="login-sub">Shop on campus and book student resources.</p>
      <button class="btn primary" id="ashesi">Sign in with Ashesi email</button>
      <div class="or">or</div>
      <button class="btn ghost" id="guest">Continue as guest</button>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
      <p class="login-help">Guests can use the marketplace only. Link an Ashesi email later to unlock Campus Resources.</p>
      <div class="login-links"><a href="#forgot">Forgot password?</a></div>
    </div>
    <div class="login-foot"><span>© 2026 Ashesi University</span><a href="#contact">Contact us</a></div>
  </section>
</main>
<script>
var m = document.getElementById('msg');
document.getElementById('ashesi').onclick = function () { m.textContent = 'Prototype: this would verify an @ashesi.edu.gh address.'; };
document.getElementById('guest').onclick = function () { m.textContent = 'Prototype: this would verify a Gmail or other email, marketplace only.'; };
</script>
</body>
</html>
