<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Orders · Campus Platform</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Poppins:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/vendor.css">
</head>
<body class="v-vendor">

  <header class="v-top">
    <div class="v-top-bar">
      <a class="v-brand" href="index.html">
        <span class="v-brand-tile"><i class="v-ic v-ic-store" aria-hidden="true"></i></span>
        <span>Campus <b>Platform</b></span>
      </a>
      <nav class="v-top-nav" aria-label="Vendor menu">
        <a href="index.html"><i class="v-ic v-ic-home" aria-hidden="true"></i>Dashboard</a>
        <a href="orders.html" aria-current="page"><i class="v-ic v-ic-receipt" aria-hidden="true"></i>Orders <span class="v-count">4</span></a>
        <a href="products.html"><i class="v-ic v-ic-package" aria-hidden="true"></i>Products</a>
        <a href="sales.html"><i class="v-ic v-ic-chart" aria-hidden="true"></i>Sales</a>
        <a href="profile.html"><i class="v-ic v-ic-store" aria-hidden="true"></i>Shop</a>
      </nav>
      <div class="v-top-actions">
        <a class="v-btn v-btn-outline" href="product-form.html" aria-label="Add product"><i class="v-ic v-ic-plus" aria-hidden="true"></i><span class="v-btn-label">Add product</span></a>
        <a class="v-iconbtn" href="notifications.html" aria-label="Notifications, 3 unread"><i class="v-ic v-ic-bell" aria-hidden="true"></i><span class="v-dot-count">3</span></a>
        <span class="v-avatar" title="Ama K.">AK</span>
      </div>
    </div>
  </header>

  <main class="page v-page">
    <div class="v-pagehead">
      <div>
        <span class="v-eyebrow">Incoming</span>
        <h1>Orders</h1>
        <p>Move each order along as you work on it. The buyer is notified at every step.</p>
      </div>
      <button class="v-btn v-btn-outline" type="button" id="refresh-btn"><i class="v-ic v-ic-trend" aria-hidden="true"></i>Refresh</button>
    </div>

    <!-- Filter tabs: vendor/orders.js reloads from GET /api/v1/vendor/orders?status= -->
    <nav class="v-tabs" aria-label="Filter orders by status">
      <a class="v-tab" href="orders.html" data-status="active" aria-current="true">Active</a>
      <a class="v-tab" href="orders.html?status=received" data-status="received">New</a>
      <a class="v-tab" href="orders.html?status=preparing" data-status="preparing">Preparing</a>
      <a class="v-tab" href="orders.html?status=ready" data-status="ready">Ready</a>
      <a class="v-tab" href="orders.html?status=completed" data-status="completed">Completed</a>
      <a class="v-tab" href="orders.html?status=cancelled" data-status="cancelled">Cancelled</a>
    </nav>

    <!-- Order cards are built by vendor/orders.js -->
    <div class="v-orders" id="order-list" aria-live="polite"></div>
  </main>

  <nav class="bottom-nav" aria-label="Vendor menu">
    <div class="items">
      <a href="index.html"><i class="v-ic v-ic-home" aria-hidden="true"></i>Home</a>
      <a href="orders.html" aria-current="page"><i class="v-ic v-ic-receipt" aria-hidden="true"></i>Orders</a>
      <a href="products.html"><i class="v-ic v-ic-package" aria-hidden="true"></i>Products</a>
      <a href="sales.html"><i class="v-ic v-ic-chart" aria-hidden="true"></i>Sales</a>
      <a href="profile.html"><i class="v-ic v-ic-store" aria-hidden="true"></i>Shop</a>
    </div>
  </nav>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/vendor/common.js"></script>
  <script src="../assets/js/vendor/orders.js"></script>
</body>
</html>
