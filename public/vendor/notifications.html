<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Notifications · Campus Platform</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Poppins:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/vendor.css">
</head>
<body class="v-vendor">

  <header class="v-top">
    <div class="v-top-bar">
      <a class="v-brand" href="index.html">
        <span class="v-brand-tile"><i class="v-ic v-ic-store" aria-hidden="true"></i></span>
        <span>Campus <b>Platform</b></span>
      </a>
      <nav class="v-top-nav" aria-label="Vendor menu">
        <a href="index.html"><i class="v-ic v-ic-home" aria-hidden="true"></i>Dashboard</a>
        <a href="orders.html"><i class="v-ic v-ic-receipt" aria-hidden="true"></i>Orders <span class="v-count">4</span></a>
        <a href="products.html"><i class="v-ic v-ic-package" aria-hidden="true"></i>Products</a>
        <a href="sales.html"><i class="v-ic v-ic-chart" aria-hidden="true"></i>Sales</a>
        <a href="profile.html"><i class="v-ic v-ic-store" aria-hidden="true"></i>Shop</a>
      </nav>
      <div class="v-top-actions">
        <a class="v-btn v-btn-outline" href="product-form.html" aria-label="Add product"><i class="v-ic v-ic-plus" aria-hidden="true"></i><span class="v-btn-label">Add product</span></a>
        <a class="v-iconbtn" href="notifications.html" aria-label="Notifications, 3 unread" aria-current="page"><i class="v-ic v-ic-bell" aria-hidden="true"></i><span class="v-dot-count">3</span></a>
        <span class="v-avatar" title="Ama K.">AK</span>
      </div>
    </div>
  </header>

  <main class="page v-page" style="max-width:900px">
    <div class="v-pagehead">
      <div>
        <span class="v-eyebrow">Updates</span>
        <h1>Notifications</h1>
        <p id="unread-text">Loading…</p>
      </div>
      <button class="v-btn v-btn-outline" type="button" id="read-all"><i class="v-ic v-ic-check" aria-hidden="true"></i>Mark all as read</button>
    </div>

    <!-- vendor/notifications.js loads GET /api/v1/notifications -->
    <section class="v-card v-flush">
      <ul class="v-rows" id="notif-list" aria-live="polite"></ul>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Vendor menu">
    <div class="items">
      <a href="index.html"><i class="v-ic v-ic-home" aria-hidden="true"></i>Home</a>
      <a href="orders.html"><i class="v-ic v-ic-receipt" aria-hidden="true"></i>Orders</a>
      <a href="products.html"><i class="v-ic v-ic-package" aria-hidden="true"></i>Products</a>
      <a href="sales.html"><i class="v-ic v-ic-chart" aria-hidden="true"></i>Sales</a>
      <a href="profile.html"><i class="v-ic v-ic-store" aria-hidden="true"></i>Shop</a>
    </div>
  </nav>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/vendor/common.js"></script>
  <script src="../assets/js/vendor/notifications.js"></script>
</body>
</html>
